<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="styles.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />

    <title>AskRose Tutor</title>
  </head>

  <body>
    <main class="auth-page">
      <div class="auth-card">
        <img
          src="https://askrose.org/wp-content/themes/ask-rose/img/logos/HH_logo.jpg"
          alt="AskRose logo"
        />

        <p class="auth-title">Tutor Portal</p>

        <p class="auth-muted">Enter your password to create a board</p>

        <form id="tutor-form" class="auth-form">
          <input
            id="tutor-password"
            type="password"
            placeholder="Tutor password"
            autocomplete="current-password"
            required
          />

          <button type="submit">Create Board</button>
        </form>
      </div>
    </main>

    <script src="tutor.js" defer></script>
  </body>
</html>
