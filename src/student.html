<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <title>AskRose Board</title>
  </head>
  <body>
    <main class="student-page">
      <div id="student-card">
        <img
          src="https://askrose.org/wp-content/themes/ask-rose/img/logos/HH_logo.jpg"
          style="height: 50px; margin: 0%"
        />
        <p class="inner-title">AskRose Board</p>
        <p class="inner-muted">Enter your 5-digit room code to join</p>
        <form id="student-form">
          <input
            id="room-code"
            type="text"
            placeholder="5-digit room code here..."
            inputmode="numeric"
            maxlength="5"
          />

          <button type="submit">Join Board</button>
        </form>
      </div>
    </main>
  </body>
</html>
