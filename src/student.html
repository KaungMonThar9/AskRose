<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="styles.css" />
    <link
      rel="icon"
      href="https://askrose.org/wp-content/uploads/2018/08/cropped-favicon_askrose-32x32.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />

    <title>AskRose Student</title>
  </head>

  <body>
    <main class="auth-page">
      <div class="auth-card">
        <img
          src="https://askrose.org/wp-content/themes/ask-rose/img/logos/HH_logo.jpg"
          alt="AskRose logo"
        />

        <p class="auth-title">AskRose Board</p>

        <p class="auth-muted">Enter your 5-digit room code to join</p>

        <form id="student-form" class="auth-form">
          <input
            id="room-code"
            type="text"
            name="roomCode"
            placeholder="5-digit room code"
            inputmode="numeric"
            maxlength="5"
            required
          />
          <button type="submit">Join Board</button>
          <p id="form-error" class="form-error" role="alert"></p>
        </form>
      </div>
    </main>

    <script src="student.js" defer></script>
  </body>
</html>
